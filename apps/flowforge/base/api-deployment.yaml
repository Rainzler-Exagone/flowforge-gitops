apiVersion: apps/v1
kind: Deployment

metadata:
  name: flowforge-api

spec:
  replicas: 1

  selector:
    matchLabels:
      app: flowforge-api

  template:
    metadata:
      labels:
        app: flowforge-api

    spec:
      containers:
        - name: api
          image: ghcr.io/rainzler-exagone/flowforge-api:latest

          ports:
            - containerPort: 3000

          env:
            - name: NODE_ENV
              value: production

            - name: PORT
              value: "3000"

            - name: LOG_LEVEL
              value: info