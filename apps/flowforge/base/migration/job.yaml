apiVersion: batch/v1
kind: Job
metadata:
  name: flowforge-db-migration
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never

      containers:
        - name: migration
          image: ghcr.io/rainzler-exagone/flowforge-migration:latest
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: flowforge-database-secret
                  key: DATABASE_URL