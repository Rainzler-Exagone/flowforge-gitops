apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: flowforge-production
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Rainzler-Exagone/flowforge-gitops.git
    targetRevision: main
    path: apps/flowforge/overlays/production

  destination:
    server: https://kubernetes.default.svc
    namespace: flowforge

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true